<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ساعت شب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;1,9..144,300&family=Lalezar&family=Monoton&family=Silkscreen&family=Vazirmatn:wght@200;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
<style>
  :root{--bg:#000;--ui:#b9b9b9;--ui-dim:#6d6d6d;--panel:#101010;--line:#262626;--chip-on:#242424}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--ui:#b9b9b9;--ui-dim:#6d6d6d;--panel:#101010;--line:#262626;--chip-on:#242424}}
  :root[data-theme="dark"]{--bg:#000;--ui:#b9b9b9;--ui-dim:#6d6d6d;--panel:#101010;--line:#262626;--chip-on:#242424}

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ui);overflow:hidden}
  body{font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:default}
  body.idle{cursor:none}

  #stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .5s ease,transform 20s ease-in-out}
  #stage.red{--c:#ff3322;--c2:#ff3322}
  .face{direction:ltr;text-align:center;line-height:1}
  .date{font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:200;direction:rtl;font-size:clamp(14px,4.2vmin,26px);opacity:.5;margin-top:3vmin;letter-spacing:.02em}

  /* 1. Serif */
  .serif{color:var(--c,#eadcc4);font-family:'Fraunces',Georgia,'Times New Roman',serif;font-variation-settings:'opsz' 144}
  .serif .hm{display:flex;flex-direction:column;align-items:center}
  .serif .h,.serif .m{font-size:min(60vw,38vh);line-height:.8;font-weight:200}
  .serif .m{font-style:italic;font-weight:300;opacity:.5}
  .serif .s{font-size:clamp(16px,5vmin,34px);font-style:italic;opacity:.35;margin-top:2vmin}
  @media (orientation:landscape){.serif .hm{flex-direction:row;gap:4vw;align-items:baseline}.serif .h,.serif .m{font-size:min(40vw,62vh)}}

  /* 2. Neon */
  .neon{color:var(--c,#ff5fd2);font-family:'Monoton','Arial Black',sans-serif}
  .neon .t{font-size:min(17vw,32vh);text-shadow:0 0 .04em currentColor,0 0 .18em currentColor,0 0 .5em color-mix(in srgb,currentColor 50%,transparent);white-space:nowrap}
  .neon .col{transition:opacity .3s}
  .neon .col.off{opacity:.15}
  .neon .s{font-size:min(7vw,10vh);margin-top:3vmin;opacity:.6;text-shadow:0 0 .2em currentColor}

  /* 3. Persian */
  .fa{color:var(--c,#f0c56e);font-family:'Lalezar','Vazirmatn',Tahoma,sans-serif}
  .fa .t{font-size:min(33vw,44vh);line-height:1.1;white-space:nowrap}
  .fa .s{font-size:min(10vw,12vh);opacity:.45;margin-top:-1vmin}
  .fa .p{direction:rtl;font-size:clamp(18px,6vmin,40px);opacity:.7;margin-top:1vmin}
  .fa .date{font-family:'Lalezar',Tahoma,sans-serif;font-weight:400;opacity:.4}

  /* 4. Words */
  .words{color:var(--c,#cfd7e8);direction:rtl;text-align:right;padding:0 8vw;width:100%;max-width:1000px}
  .words .l1{font-weight:200;font-size:clamp(18px,6vmin,40px);opacity:.4}
  .words .l2{font-weight:600;font-size:min(24vw,22vh);line-height:1.15}
  .words .l3{font-weight:200;font-size:min(10vw,10vh);line-height:1.35;opacity:.85}
  .words .l4{font-weight:200;font-size:clamp(18px,6vmin,40px);opacity:.4;margin-top:2vmin}

  /* 5. Analog */
  .analog{color:var(--c,#dcdcdc)}
  .analog svg{width:min(86vw,76vh);height:auto;display:block;margin:auto;overflow:visible}
  .analog .tick{stroke:currentColor;stroke-linecap:round}
  .analog .dot{fill:currentColor;opacity:.35}
  .analog .hand{stroke:currentColor;stroke-linecap:round}
  .analog .sec{stroke:var(--c2,#ff5a45);fill:var(--c2,#ff5a45)}

  /* 6. Pixel */
  .pix{color:var(--c,#79ff9d);font-family:'Silkscreen','Courier New',monospace}
  .pix .t{font-size:min(19vw,30vh);white-space:nowrap;text-shadow:0 0 .12em color-mix(in srgb,currentColor 45%,transparent)}
  .pix .bar{display:grid;grid-template-columns:repeat(30,1fr);gap:min(1vw,6px);width:min(80vw,700px);margin:4vmin auto 0}
  .pix .bar i{display:block;aspect-ratio:1;background:currentColor;opacity:.08}
  .pix .bar i.on{opacity:.85}
  .pix .d{font-size:clamp(12px,3.6vmin,22px);opacity:.45;margin-top:3vmin;direction:ltr}

  /* 7. Seven segment */
  .seg{color:var(--c,#58e3ff)}
  .seg .row{display:flex;justify-content:center;align-items:center;gap:min(1.6vw,12px);transform:skewX(-7deg)}
  .seg .main{filter:drop-shadow(0 0 6px color-mix(in srgb,currentColor 55%,transparent))}
  .seg .main .dg{height:min(30vw,36vh);width:auto}
  .seg .small{margin-top:4vmin;opacity:.55}
  .seg .small .dg{height:min(11vw,12vh);width:auto}
  .seg polygon{fill:currentColor;opacity:.06}
  .seg polygon.lit{opacity:1}
  .seg .colon{display:flex;flex-direction:column;gap:min(8vw,10vh);padding:0 min(1vw,8px)}
  .seg .colon i{display:block;width:min(3.2vw,3.6vh);aspect-ratio:1;background:currentColor;transition:opacity .25s}
  .seg .colon.off i{opacity:.08}
  .seg .ap{font-family:'Vazirmatn',sans-serif;font-weight:200;font-size:clamp(14px,4vmin,24px);opacity:.5;margin-top:2vmin;direction:rtl}

  /* Hint + panel */
  #hint{position:fixed;inset:auto 0 calc(24px + env(safe-area-inset-bottom)) 0;text-align:center;font-size:14px;line-height:1.8;color:var(--ui-dim);transition:opacity 1s;pointer-events:none}
  #hint.gone{opacity:0}

  #panel{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,20px);width:min(440px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 16px 12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;font-size:15px;color:var(--ui)}
  #panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .p-style{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .p-style strong{font-weight:600;font-size:18px;color:#e6e6e6}
  .nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ui);font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer}
  .dots{display:flex;justify-content:center;gap:6px;margin:8px 0 14px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .dots i.on{background:#bdbdbd}
  .bright{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .bright span{white-space:nowrap}
  input[type=range]{flex:1;accent-color:#9a9a9a;height:28px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{flex:1 1 auto;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ui-dim);font:inherit;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--chip-on);color:#eaeaea;border-color:#3a3a3a}
  #wakeStatus{margin:2px 0 0;font-size:13px;color:var(--ui-dim);min-height:1.4em;text-align:center}
  button:focus-visible,input:focus-visible{outline:2px solid #8a8a8a;outline-offset:2px}

  @media (prefers-reduced-motion: reduce){#stage{transition:opacity .2s}#panel{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="hint">برای تنظیمات روی صفحه بزنید<br>برای عوض کردن حالت، به چپ یا راست بکشید</div>

<div id="panel" role="dialog" aria-label="تنظیمات ساعت">
  <div class="p-style">
    <button class="nav" id="prev" aria-label="حالت قبلی">›</button>
    <strong id="styleName"></strong>
    <button class="nav" id="next" aria-label="حالت بعدی">‹</button>
  </div>
  <div class="dots" id="dots"></div>
  <label class="bright"><span>روشنایی</span><input type="range" id="bright" min="12" max="100" step="1"></label>
  <div class="chips">
    <button class="chip" data-opt="h24" aria-pressed="false">۲۴ ساعته</button>
    <button class="chip" data-opt="sec" aria-pressed="false">ثانیه</button>
    <button class="chip" data-opt="red" aria-pressed="false">نور قرمز</button>
  </div>
  <div class="chips">
    <button class="chip" id="wakeBtn" aria-pressed="false">صفحه روشن بماند</button>
    <button class="chip" id="fsBtn">تمام‌صفحه</button>
  </div>
  <p id="wakeStatus"></p>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), panel = $('#panel');
  const FA_DIG = '۰۱۲۳۴۵۶۷۸۹';
  const toFa = s => String(s).replace(/\d/g, d => FA_DIG[d]);
  const p2 = n => String(n).padStart(2,'0');

  /* ---------- settings ---------- */
  const DEF = {face:0, bright:70, h24:true, sec:false, red:false, wake:true};
  let opts = Object.assign({}, DEF);
  try { const raw = localStorage.getItem('nightclock'); if (raw) Object.assign(opts, JSON.parse(raw)); } catch(e){}
  const save = () => { try { localStorage.setItem('nightclock', JSON.stringify(opts)); } catch(e){} };

  /* ---------- helpers ---------- */
  let dateFmt;
  try { dateFmt = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {weekday:'long', day:'numeric', month:'long'}); }
  catch(e){ dateFmt = { format: d => d.toDateString() }; }
  const faDate = d => dateFmt.format(d);
  const hourOf = h => opts.h24 ? h : (h % 12 || 12);
  const period = h => h < 5 ? 'بامداد' : h < 12 ? 'صبح' : h < 14 ? 'ظهر' : h < 18 ? 'عصر' : 'شب';

  const ONES = ['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const TEENS = ['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const TENS = ['','','بیست','سی','چهل','پنجاه'];
  const word = n => n === 0 ? 'صفر' : n < 10 ? ONES[n] : n < 20 ? TEENS[n-10] : TENS[Math.floor(n/10)] + (n%10 ? ' و ' + ONES[n%10] : '');

  /* ---------- faces ---------- */
  const faces = [
    { name:'سریف',
      build(el){ el.innerHTML = '<div class="face serif"><div class="hm"><span class="h"></span><span class="m"></span></div><div class="s"></div><div class="date"></div></div>'; },
      tick(el,d){
        el.querySelector('.h').textContent = p2(hourOf(d.getHours()));
        el.querySelector('.m').textContent = p2(d.getMinutes());
        const s = el.querySelector('.s'); s.style.display = opts.sec ? '' : 'none'; s.textContent = p2(d.getSeconds());
        el.querySelector('.date').textContent = faDate(d);
      }},
    { name:'نئون',
      build(el){ el.innerHTML = '<div class="face neon"><div class="t"><span class="h"></span><span class="col">:</span><span class="m"></span></div><div class="s"></div></div>'; },
      tick(el,d){
        el.querySelector('.h').textContent = p2(hourOf(d.getHours()));
        el.querySelector('.m').textContent = p2(d.getMinutes());
        el.querySelector('.col').classList.toggle('off', d.getSeconds() % 2 === 1);
        const s = el.querySelector('.s'); s.style.display = opts.sec ? '' : 'none'; s.textContent = p2(d.getSeconds());
      }},
    { name:'فارسی',
      build(el){ el.innerHTML = '<div class="face fa"><div class="t"></div><div class="s"></div><div class="p"></div><div class="date"></div></div>'; },
      tick(el,d){
        el.querySelector('.t').textContent = toFa(p2(hourOf(d.getHours())) + ':' + p2(d.getMinutes()));
        const s = el.querySelector('.s'); s.style.display = opts.sec ? '' : 'none'; s.textContent = toFa(p2(d.getSeconds()));
        el.querySelector('.p').textContent = period(d.getHours());
        el.querySelector('.date').textContent = faDate(d);
      }},
    { name:'کلمات',
      build(el){ el.innerHTML = '<div class="face words"><div class="l1">ساعت</div><div class="l2"></div><div class="l3"></div><div class="l4"></div></div>'; },
      tick(el,d){
        const h = d.getHours() % 12 || 12, m = d.getMinutes(), s = d.getSeconds();
        el.querySelector('.l2').textContent = word(h);
        let tail = m === 0 ? 'تمام' : m === 15 ? 'و ربع' : m === 30 ? 'و نیم' : 'و ' + word(m) + ' دقیقه';
        if (opts.sec && s) tail += ' و ' + word(s) + ' ثانیه';
        el.querySelector('.l3').textContent = tail;
        el.querySelector('.l4').textContent = period(d.getHours()) + '، ' + faDate(d);
      }},
    { name:'عقربه‌ای',
      build(el){
        let ticks = '';
        for (let i = 0; i < 60; i++) {
          const a = i * 6;
          ticks += i % 5 === 0
            ? `<line class="tick" x1="0" y1="-46" x2="0" y2="-40" stroke-width="${i % 15 === 0 ? 1.6 : 1}" transform="rotate(${a})"/>`
            : `<circle class="dot" cx="0" cy="-45" r=".35" transform="rotate(${a})"/>`;
        }
        el.innerHTML = `<div class="face analog"><svg viewBox="-50 -50 100 100" aria-hidden="true">${ticks}
          <line class="hand hh" x1="0" y1="5" x2="0" y2="-24" stroke-width="2.8"/>
          <line class="hand mh" x1="0" y1="7" x2="0" y2="-37" stroke-width="1.5"/>
          <g class="sh"><line class="sec" x1="0" y1="11" x2="0" y2="-42" stroke-width=".5"/><circle class="sec" r="1.7"/></g>
          <circle r=".7" fill="#000"/></svg><div class="date"></div></div>`;
      },
      tick(el,d){
        const h = d.getHours() % 12, m = d.getMinutes(), s = d.getSeconds();
        el.querySelector('.hh').setAttribute('transform', `rotate(${h*30 + m*.5})`);
        el.querySelector('.mh').setAttribute('transform', `rotate(${m*6 + s*.1})`);
        const sh = el.querySelector('.sh'); sh.style.display = opts.sec ? '' : 'none'; sh.setAttribute('transform', `rotate(${s*6})`);
        el.querySelector('.date').textContent = faDate(d);
      }},
    { name:'پیکسلی',
      build(el){
        el.innerHTML = '<div class="face pix"><div class="t"></div><div class="bar">' + '<i></i>'.repeat(60) + '</div><div class="d"></div></div>';
      },
      tick(el,d){
        el.querySelector('.t').textContent = p2(hourOf(d.getHours())) + ':' + p2(d.getMinutes());
        const bar = el.querySelector('.bar'); bar.style.display = opts.sec ? '' : 'none';
        const s = d.getSeconds();
        bar.querySelectorAll('i').forEach((i,k) => i.classList.toggle('on', k <= s));
        const dd = el.querySelector('.d');
        dd.textContent = opts.h24 ? '' : (d.getHours() < 12 ? 'AM' : 'PM');
      }},
    { name:'هفت‌قطعه‌ای',
      build(el){
        const dg = () => `<svg class="dg" viewBox="-2 0 64 100" aria-hidden="true">${'abcdefg'.split('').map(k => `<polygon data-s="${k}" points="${SEG[k]}"/>`).join('')}</svg>`;
        el.innerHTML = `<div class="face seg"><div class="row main">${dg()}${dg()}<div class="colon"><i></i><i></i></div>${dg()}${dg()}</div><div class="row small">${dg()}${dg()}</div><div class="ap"></div></div>`;
      },
      tick(el,d){
        const hr = hourOf(d.getHours());
        const hs = opts.h24 ? p2(hr) : String(hr).padStart(2,' ');
        const str = hs + p2(d.getMinutes()) + p2(d.getSeconds());
        el.querySelectorAll('.dg').forEach((svg,i) => setDigit(svg, str[i]));
        el.querySelector('.colon').classList.toggle('off', d.getSeconds() % 2 === 1);
        el.querySelector('.small').style.display = opts.sec ? '' : 'none';
        el.querySelector('.ap').textContent = opts.h24 ? faDate(d) : period(d.getHours()) + '، ' + faDate(d);
      }}
  ];

  const H = (x1,x2,y) => `${x1},${y} ${x1+5},${y-5} ${x2-5},${y-5} ${x2},${y} ${x2-5},${y+5} ${x1+5},${y+5}`;
  const V = (x,y1,y2) => `${x},${y1} ${x+5},${y1+5} ${x+5},${y2-5} ${x},${y2} ${x-5},${y2-5} ${x-5},${y1+5}`;
  const SEG = {a:H(11,49,8), b:V(54,12,47), c:V(54,53,88), d:H(11,49,92), e:V(6,53,88), f:V(6,12,47), g:H(11,49,50)};
  const DIG = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg',' ':''};
  function setDigit(svg, ch){
    const on = DIG[ch] || '';
    svg.querySelectorAll('polygon').forEach(p => p.classList.toggle('lit', on.includes(p.dataset.s)));
  }

  /* ---------- render loop ---------- */
  let timer;
  function tick(){
    const d = new Date();
    faces[opts.face].tick(stage, d);
    clearTimeout(timer);
    timer = setTimeout(tick, 1000 - d.getMilliseconds() + 8);
  }

  function applyAll(){
    opts.face = ((opts.face % faces.length) + faces.length) % faces.length;
    faces[opts.face].build(stage);
    stage.style.opacity = opts.bright / 100;
    stage.classList.toggle('red', opts.red);
    $('#styleName').textContent = faces[opts.face].name;
    $('#bright').value = opts.bright;
    document.querySelectorAll('.chip[data-opt]').forEach(b => b.setAttribute('aria-pressed', String(!!opts[b.dataset.opt])));
    $('#dots').innerHTML = faces.map((_,i) => `<i class="${i === opts.face ? 'on' : ''}"></i>`).join('');
    tick();
    save();
  }

  /* Burn-in protection: drift the whole clock a little every minute */
  function drift(){
    const r = () => (Math.random() * 2 - 1) * 2.2;
    stage.style.transform = `translate(${r()}vmin, ${r()}vmin)`;
  }
  setInterval(drift, 60000);

  /* ---------- keep screen awake ---------- */
  let wakeLock = null, noSleep = null;
  const wakeStatus = $('#wakeStatus'), wakeBtn = $('#wakeBtn');
  async function enableWake(){
    opts.wake = true; save();
    wakeBtn.setAttribute('aria-pressed','true');
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
        wakeStatus.textContent = 'صفحه روشن می‌ماند.';
        return;
      } catch(e) {}
    } else if (window.NoSleep) {
      try {
        noSleep = noSleep || new NoSleep();
        await noSleep.enable();
        wakeStatus.textContent = 'صفحه روشن می‌ماند.';
        return;
      } catch(e) {}
    }
    wakeStatus.textContent = 'مرورگر اجازه نداد. لینک را مستقیم در مرورگر باز کنید یا قفل خودکار گوشی را موقتاً خاموش کنید.';
  }
  function disableWake(){
    opts.wake = false; save();
    wakeBtn.setAttribute('aria-pressed','false');
    try { wakeLock && wakeLock.release(); } catch(e){}
    try { noSleep && noSleep.disable(); } catch(e){}
    wakeLock = null;
    wakeStatus.textContent = 'صفحه طبق تنظیمات گوشی خاموش می‌شود.';
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && opts.wake && !wakeLock) enableWake();
  });
  let firstGesture = true;
  function onFirstGesture(){
    if (!firstGesture) return;
    firstGesture = false;
    if (opts.wake) enableWake();
  }

  /* ---------- panel ---------- */
  let hideT;
  function showPanel(){ panel.classList.add('show'); document.body.classList.remove('idle'); bumpPanel(); }
  function hidePanel(){ panel.classList.remove('show'); document.body.classList.add('idle'); }
  function bumpPanel(){ clearTimeout(hideT); hideT = setTimeout(hidePanel, 6000); }
  panel.addEventListener('pointerdown', bumpPanel);
  panel.addEventListener('input', bumpPanel);

  $('#prev').onclick = () => { opts.face--; applyAll(); };
  $('#next').onclick = () => { opts.face++; applyAll(); };
  $('#bright').oninput = e => { opts.bright = +e.target.value; stage.style.opacity = opts.bright / 100; save(); };
  document.querySelectorAll('.chip[data-opt]').forEach(b => b.onclick = () => { opts[b.dataset.opt] = !opts[b.dataset.opt]; applyAll(); });
  wakeBtn.onclick = () => opts.wake && (wakeLock || noSleep) ? disableWake() : enableWake();

  const fsBtn = $('#fsBtn'), root = document.documentElement;
  const canFs = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!canFs) fsBtn.style.display = 'none';
  fsBtn.onclick = () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else canFs.call(root);
    } catch(e){}
  };

  /* ---------- gestures on the clock ---------- */
  let sx = 0, sy = 0, down = false;
  window.addEventListener('pointerdown', e => {
    onFirstGesture();
    if (panel.contains(e.target)) return;
    down = true; sx = e.clientX; sy = e.clientY;
  });
  window.addEventListener('pointerup', e => {
    if (!down) return; down = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      opts.face += dx < 0 ? 1 : -1; applyAll();
      if (panel.classList.contains('show')) bumpPanel();
    } else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      panel.classList.contains('show') ? hidePanel() : showPanel();
    }
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { opts.face++; applyAll(); }
    if (e.key === 'ArrowRight') { opts.face--; applyAll(); }
  });

  /* ---------- start ---------- */
  applyAll();
  if (opts.wake) enableWake();
  wakeBtn.setAttribute('aria-pressed', String(opts.wake));
  document.body.classList.add('idle');
  setTimeout(() => $('#hint').classList.add('gone'), 5000);
  (document.fonts && document.fonts.ready || Promise.resolve()).then(tick);
})();
</script>
</body>
</html>
